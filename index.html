<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stradbroke Island Tickets</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #0077ff, #00c2ff);
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      font-size: 18px;
      margin-top: 10px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card h2 {
      margin-top: 0;
    }

    .price {
      font-size: 24px;
      color: #0077ff;
      margin: 10px 0;
    }

    button {
      background: #0077ff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #005fcc;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h1>Stradbroke Island Tickets</h1>
    <p>Book your ferry tickets quickly and easily</p>
  </header>

  <div class="container">

    <div class="cards">

      <div class="card">
        <h2>Adult Ticket</h2>
        <div class="price">$25</div>
        <p>One-way ferry ticket for adults</p>
        <button>Book Now</button>
      </div>

      <div class="card">
        <h2>Child Ticket</h2>
        <div class="price">$15</div>
        <p>For children aged 5–15</p>
        <button>Book Now</button>
      </div>

      <div class="card">
        <h2>Family Pass</h2>
        <div class="price">$60</div>
        <p>2 adults + 2 children</p>
        <button>Book Now</button>
      </div>

    </div>

  </div>

  <footer>
    © 2026 Stradbroke Tickets (School Project)
  </footer>

</body>
</html>
